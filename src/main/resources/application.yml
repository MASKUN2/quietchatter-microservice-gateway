server:
  port: 8080

spring:
  application:
    name: microservice-api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${MEMBER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/auth/**
            - id: member-service
              uri: ${MEMBER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/members/**
            - id: support-service
              uri: ${MEMBER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/support/**
            - id: book-service
              uri: ${BOOK_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/books/**
            - id: talk-service
              uri: ${TALK_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/talks/**,/api/reactions/**

jwt:
  secret-key: ${JWT_SECRET_KEY:your-very-long-secret-key-at-least-32-chars-long}

app:
  cookie:
    domain: ${COOKIE_DOMAIN:}
    secure: ${COOKIE_SECURE:false}
    same-site: Lax
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "https://dev.quiet-chatter.com"
      - "https://quiet-chatter.com"
